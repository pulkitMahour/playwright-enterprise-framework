name: Playwright

on:
  push:
  # schedule:
  #   # nightly smoke against the deployed app
  #   - cron: '0 2 * * *'
  workflow_dispatch:

env:
  TEST_ROLE: user
  USER_EMAIL: user@demo.com
  USER_PASSWORD: user123
  ADMIN_EMAIL: admin@demo.com
  ADMIN_PASSWORD: admin123

jobs:
  quality:
    name: Quality gates (types, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  full-suite:
    name: Full suite (TestMart booted in-job)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      BASE_URL: http://localhost:5173

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Checkout TestMart
        uses: actions/checkout@v4
        with:
          repository: pulkitMahour/testmart
          path: app

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'app/server/package-lock.json', 'app/client/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install test dependencies
        run: npm ci

      - name: Install app dependencies
        working-directory: app
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: app/node_modules/.cache/mongodb-memory-server
          key: mongod-${{ runner.os }}-7.0

      - name: Start TestMart
        working-directory: app
        run: |
          npm run dev > "${GITHUB_WORKSPACE}/testmart.log" 2>&1 &
          echo "started"

      - name: Wait for TestMart
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5000/api/health > /dev/null \
               && curl -sf http://localhost:5173 > /dev/null; then
              echo "TestMart is up after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "::error::TestMart did not come up within 180s"
          cat "${GITHUB_WORKSPACE}/testmart.log"
          exit 1

      # The Steps in a container job run as root, but $HOME is /github/home, owned by the image's `pwuser`. Firefox refuses to start in that situation ("Running Nightly as root in a regular user's session is not supported"). Chromium and WebKit do not care. Set only here, so the npm cache above keeps using /github/home.
      - name: Run tests
        env:
          HOME: /root
        run: npx playwright test

      # Fills the Allure dashboard's Environment and Executors widgets. The `-d` guard matters: creating the dir with no results would defeat the hashFiles gate in publish-report.
      - name: Add Allure environment and executor metadata
        if: always()
        shell: bash
        run: |
          [ -d allure-results ] || { echo "no allure-results — nothing to annotate"; exit 0; }
          {
            echo "BASE_URL=${BASE_URL}"
            echo "Branch=${GITHUB_REF_NAME}"
            echo "Commit=${GITHUB_SHA:0:7}"
            echo "Playwright=$(npx playwright --version | sed 's/^Version //')"
            echo "Node=$(node -v)"
            echo "Image=mcr.microsoft.com/playwright:v1.62.0-noble"
            echo "Projects=api, chromium, firefox, webkit"
            echo "Workers=2"
          } > allure-results/environment.properties
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "Playwright full suite",
            "buildOrder": ${GITHUB_RUN_NUMBER},
            "buildName": "playwright.yml #${GITHUB_RUN_NUMBER}",
            "buildUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "reportUrl": "https://pulkitmahour.github.io/playwright-enterprise-framework/"
          }
          EOF
          cat allure-results/environment.properties

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 4

      # Raw JSON only — the HTML report is built in publish-report, which has a JVM.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 1

      - name: Upload TestMart log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testmart-log
          path: testmart.log
          retention-days: 4

  publish-report:
    name: Publish Allure report to Pages
    needs: full-suite
    if: always() && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Checkout gh-pages for Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results

      - name: Restore history
        run: '[ -d gh-pages/history ] && cp -r gh-pages/history allure-results/ || true'

      - name: Generate Allure report
        if: hashFiles('allure-results/*') != ''
        run: npx --yes allure-commandline generate allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        if: hashFiles('allure-results/*') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

  smoke-render:
    name: Smoke (deployed on Render)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      BASE_URL: https://testmart-gvcc.onrender.com

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install test dependencies
        run: npm ci

      # Render's free tier spins the instance down; the first request takes ~50s to wake it.
      - name: Wake the instance
        run: |
          for i in $(seq 1 60); do
            if curl -sf --max-time 20 "${BASE_URL}/api/health" > /dev/null; then
              echo "Awake after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${BASE_URL} did not wake within 300s"
          exit 1

      - name: Run smoke tests
        run: npm run test:smoke:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 4
